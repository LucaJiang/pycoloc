name: tests-and-packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PRUSIE_NUM_THREADS: '1'
  MPLBACKEND: Agg
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.16.9
      - run: ruff check
      - run: ruff format --check
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Install wheel in an independent environment
        env:
          TEST_PYTHON: ${{ matrix.python }}
        run: |
          python -m venv "$RUNNER_TEMP/test-env"
          py="$RUNNER_TEMP/test-env/bin/python"
          numpy=()
          if [[ "$TEST_PYTHON" == 3.10 ]]; then numpy=('numpy==1.26.4'); fi
          "$py" -m pip install dist/*.whl pytest numba gffutils "${numpy[@]}"
          cp -R tests examples "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$py" -c 'import importlib.util, importlib.metadata, pycoloc; assert importlib.util.find_spec("prusie") is None; assert pycoloc.__version__ == importlib.metadata.version("pycoloc") == "0.2.2"'
          "$py" -m pytest tests
          "$py" examples/quickstart.py
          "$py" examples/check_example.py --output-dir example-output
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install . pytest prusie==0.3.1
      - run: python -m pytest tests/test_prusie_integration.py
      - run: python examples/check_example.py --native-pair --output-dir native-example-output
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/docs-requirements.txt
      - run: python tools/build_docs.py --check
      - run: python tools/check_docs.py
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip wheel --no-deps dist/*.tar.gz -w rebuilt
      - name: Install the rebuilt wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/rebuilt-env"
          py="$RUNNER_TEMP/rebuilt-env/bin/python"
          "$py" -m pip install rebuilt/*.whl
          cp -R examples "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$py" examples/quickstart.py
